<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#e14b4d" />
    <meta name="description" content="BloodConnect — a calm, accountable command center for blood donation coordination." />
    <title>BloodConnect — Command center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary navigation">
        <button class="brand" data-view="dashboard" aria-label="Go to BloodConnect command center">
          <span class="brand-mark" aria-hidden="true"><span></span></span>
          <span class="brand-wordmark">blood<span>connect</span></span>
        </button>
        <div class="sidebar-label">Workspace</div>
        <nav class="primary-nav">
          <button class="nav-item active" data-view="dashboard"><span class="nav-icon" data-icon="grid"></span><span>Command center</span></button>
          <button class="nav-item" data-view="requests"><span class="nav-icon" data-icon="pulse"></span><span>Blood requests</span><span class="nav-count">08</span></button>
          <button class="nav-item" data-view="inventory"><span class="nav-icon" data-icon="drop"></span><span>Inventory</span></button>
          <button class="nav-item" data-view="notifications"><span class="nav-icon" data-icon="bell"></span><span>Notifications</span><span class="nav-dot"></span></button>
          <button class="nav-item" data-view="reports"><span class="nav-icon" data-icon="chart"></span><span>Reports</span></button>
        </nav>
        <div class="sidebar-label secondary-label">System</div>
        <nav class="primary-nav">
          <button class="nav-item" data-view="architecture"><span class="nav-icon" data-icon="layers"></span><span>How it works</span></button>
          <button class="nav-item" data-view="settings"><span class="nav-icon" data-icon="settings"></span><span>Settings</span></button>
        </nav>
        <div class="sidebar-footer">
          <div class="security-note"><span class="tiny-shield" data-icon="shield"></span><div><strong>Protected workspace</strong><span>Demo mode · no real PII</span></div></div>
          <div class="sidebar-user"><span class="avatar avatar-red">AK</span><div><strong>Arjun Kapoor</strong><span>Blood Bank operator</span></div><button class="more-button" aria-label="More profile options">•••</button></div>
        </div>
      </aside>

      <main class="main-content">
        <header class="topbar">
          <div class="mobile-brand"><span class="brand-mark" aria-hidden="true"><span></span></span><span class="brand-wordmark">blood<span>connect</span></span></div>
          <div class="breadcrumb"><span>Workspace</span><span class="breadcrumb-separator">/</span><strong id="breadcrumb-current">Command center</strong></div>
          <div class="topbar-actions">
            <span class="demo-badge"><span class="live-dot"></span> Demo data</span>
            <button class="icon-button" aria-label="Search" data-action="focus-search"><span data-icon="search"></span></button>
            <button class="icon-button notification-button" aria-label="Open notifications" data-view="notifications"><span data-icon="bell"></span><i></i></button>
            <button class="profile-trigger"><span class="avatar avatar-light">AK</span><span class="profile-copy"><strong>Arjun Kapoor</strong><small>Operator</small></span><span class="chevron">⌄</span></button>
          </div>
        </header>

        <div id="app" class="page-content" tabindex="-1"></div>

        <footer class="footer"><span>BloodConnect · Semester III mini project prototype</span><span>Designed for accountable coordination, not medical decision-making.</span></footer>
      </main>
    </div>
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
